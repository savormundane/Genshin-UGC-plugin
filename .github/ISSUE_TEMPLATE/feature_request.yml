name: 功能与文档建议
description: 建议平台能力、工作流改进或文档修正
title: "[Proposal] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 目前遇到的问题
      description: "请先描述要完成什么，现有工具为什么不足"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及领域
      options:
        - Editor
        - Graph Code
        - Client Lua
        - GIL
        - Assets
        - 共享工具与诊断
        - 安装与文档
        - 不确定
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: 建议做法
      description: "如有平台依据、官方 API 链接、适用版本或示例，请一并提供"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方法或替代方案

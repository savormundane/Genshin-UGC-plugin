name: 功能与文档建议
description: 提出想解决的实际问题
title: "[Proposal] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想完成什么任务？
      description: 说明目前在哪里卡住，以及希望得到的结果。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 相关资料或示例
      description: 可附官方资料、适用版本、可共享示例或已经尝试过的办法。

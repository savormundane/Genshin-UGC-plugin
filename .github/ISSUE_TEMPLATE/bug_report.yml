name: 问题反馈
description: 报告安装、使用、文档或兼容性问题
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想做什么，遇到了什么？
      description: 写下预期结果、实际情况和能复现的步骤。报错文字或截图有帮助，请先去掉私人信息。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 所用版本
      placeholder: 发行版本号或源码提交。不清楚时可填“不确定”。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 环境与可共享的输入
      description: 可补充客户端、操作系统、千星奇域版本和可以公开的最小复现。

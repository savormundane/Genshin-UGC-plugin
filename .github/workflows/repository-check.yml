name: Repository checks (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository metadata and documentation
        run: python3 scripts/check_repository.py
      - name: Python syntax
        run: python3 -m compileall -q scripts
      - name: GIL toolkit regression
        run: node scripts/test_gil.mjs

  windows-release-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locked runtime dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/runtime-requirements.lock
      - name: Repository and release checks
        run: |
          python -B scripts/check_repository.py
          python -B scripts/test_release.py -v
          python -B scripts/test_distribution.py -v
          python -B scripts/test_release_behaviors.py -v
      - name: Local MCP and minimum software render
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'ugc-project'
          $outputs = Join-Path $env:RUNNER_TEMP 'ugc-outputs'
          New-Item -ItemType Directory -Force $project,$outputs | Out-Null
          $config = Join-Path $env:RUNNER_TEMP 'ugc-runtime.json'
          @{schema=1;python=(Get-Command python).Source;project_root=$project;output_root=$outputs} | ConvertTo-Json | Set-Content -Encoding utf8BOM $config
          python -B scripts/install_smoke.py --config $config --node (Get-Command node).Source

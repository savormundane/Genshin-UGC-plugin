- insert:
    - id: miliastra-wonderland-paths
      name: ./scripts/dsh-paths.mjs
    - id: miliastra-wonderland-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      inject: [miliastraWonderlandPaths]
      config:
        providerName: miliastra-wonderland
        includeDefaultRoots: false
        customSkillDirs: !!js '[ctx.miliastraWonderlandPaths.skills]'
    - id: miliastra-wonderland-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      inject: [miliastraWonderlandPaths]
      config:
        serverName: miliastra_wonderland
        transport: stdio
        command: node
        args: !!js '[ctx.miliastraWonderlandPaths.launcher]'
        toolCallTimeoutMs: 930000

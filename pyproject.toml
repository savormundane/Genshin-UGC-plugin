[project]
name = "miliastra-wonderland"
version = "0.0.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "mcp==2.3.0",
    "lupa==2.6",
    "Pillow==13.0.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64' and implementation_name == 'cpython'"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["vendor", "references"]

[tool.ruff.format]
quote-style = "preserve"
